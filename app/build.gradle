plugins { id 'com.android.application' }
android {
    namespace 'id.ac.umko.jurnalbelajar'
    compileSdk 34
    defaultConfig {
        applicationId "id.ac.umko.jurnalbelajar"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
